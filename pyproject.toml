[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mountain-hmmaxent"
version = "1.0.0"
description = "Reproducibility utilities for cross-range mountain plant SDM transfer analyses"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
